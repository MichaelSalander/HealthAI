<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI健康管理｜首页</title>
  <style>
    :root{--brand:#10b8a4;--brand-dark:#087e78;--ink:#15223a;--muted:#71828a;--bg:#f5fbfa;--line:#e8f0ef;--danger:#f04438;--shadow:0 10px 30px rgba(16,112,103,.08)}
    *{box-sizing:border-box}body{margin:0;background:#dfeae8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    .phone{width:390px;min-height:844px;margin:28px auto;background:var(--bg);overflow:hidden;box-shadow:0 22px 70px rgba(15,57,53,.2);position:relative}
    .status{height:28px;padding:9px 22px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700;background:#f8fffd}.status span:last-child{letter-spacing:2px}
    .screen{padding:0 18px 92px}.hero{margin:0 -18px;padding:24px 28px 26px;background:linear-gradient(145deg,#c9f6ed,#f9fffd 72%);border-radius:0 0 28px 28px;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:24px;bottom:9px;color:#7bdacc66;font-size:78px}.hello{font-size:25px;font-weight:800;line-height:1.3;position:relative;z-index:1}.hello small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:7px}
    .section{display:flex;align-items:center;justify-content:space-between;margin:22px 0 11px}.section h2{font-size:17px;margin:0}.section a{font-size:12px;color:var(--brand-dark)}
    .card{background:white;border-radius:19px;padding:17px;box-shadow:var(--shadow);border:1px solid #eff7f5}.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px}.entry button{border:0;border-radius:14px;padding:15px 8px;background:#e8fbf7;color:var(--brand-dark);font-size:13px;font-weight:700;text-align:left}.entry button:first-child{background:var(--brand);color:white}.entry b{display:block;font-size:24px;margin-bottom:10px}.entry span{display:block;font-size:12px;font-weight:500;opacity:.85}
    .score-card{display:flex;align-items:center;gap:17px}.score{width:90px;height:90px;border-radius:50%;border:9px solid #b9f1e7;border-right-color:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}.score strong{font-size:29px}.score span{font-size:10px;color:var(--muted)}.score-copy h3{margin:0 0 6px;font-size:16px}.score-copy p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
    .consultant{display:flex;align-items:center;gap:12px}.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(145deg,#f5d5ca,#fff);display:grid;place-items:center;font-size:29px}.consultant-main{flex:1}.consultant-main strong{display:block;font-size:15px}.consultant-main span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.online{background:#e7faf6;color:var(--brand-dark);font-size:11px;padding:6px 9px;border-radius:9px}.primary{display:block;border:0;width:100%;margin-top:14px;padding:13px;border-radius:13px;background:var(--brand);color:white;font-weight:700;font-size:14px}.secondary{background:#ecfbf8;color:var(--brand-dark)}
    .notice{display:flex;gap:12px;align-items:center;padding:13px 15px;background:#fff4df;border-radius:15px;color:#805816;font-size:12px;line-height:1.5}.notice b{font-size:21px}.nav{position:absolute;bottom:0;left:0;right:0;height:72px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 7px 7px;backdrop-filter:blur(12px)}.nav button{border:0;background:transparent;color:#81918f;font-size:10px}.nav button b{display:block;font-size:21px;margin-bottom:3px;font-weight:500}.nav button.active{color:var(--brand-dark)}
    .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#15223a;color:white;border-radius:12px;padding:10px 15px;font-size:12px;display:none}.toast.show{display:block}.modal{display:none;position:absolute;inset:0;background:#0006;align-items:flex-end;z-index:5}.modal.show{display:flex}.sheet{width:100%;background:white;border-radius:25px 25px 0 0;padding:24px 20px 30px}.sheet h3{margin:0 0 7px;font-size:18px}.sheet p{color:var(--muted);font-size:13px;margin:0 0 18px}.close{float:right;border:0;background:#f2f6f5;border-radius:50%;width:28px;height:28px}.upload{border:1px dashed #80d9cd;border-radius:16px;text-align:center;padding:27px;color:var(--brand-dark);font-size:13px}
    @media(max-width:430px){body{background:var(--bg)}.phone{margin:0;width:100%;box-shadow:none;min-height:100vh}}
  </style>
</head>
<body>
  <main class="phone">
    <div class="status"><span>9:41</span><span>▮▮▮  Wi-Fi  🔋</span></div>
    <div class="screen">
      <header class="hero"><div class="hello">你好，张小美<small>开启你的健康管理之旅</small></div></header>
      <div class="section"><h2>健康数据入口</h2><a>建立个人健康档案</a></div>
      <section class="card entry"><button id="uploadBtn"><b>▧</b>上传体检报告<span>AI辅助生成基础结果</span></button><button id="manualBtn"><b>＋</b>手动录入数据<span>记录每日健康变化</span></button></section>
      <div class="section"><h2>我的健康</h2><a id="healthLink">查看详细健康 ›</a></div>
      <section class="card score-card"><div class="score"><strong>85</strong><span>健康评分</span></div><div class="score-copy"><h3>整体健康状况良好</h3><p>继续保持良好的生活方式<br/>已有 3 项指标需要关注</p></div></section>
      <div class="section"><h2>我的主责健康管理师</h2><a>服务中</a></div>
      <section class="card"><div class="consultant"><div class="avatar">👩🏻‍⚕️</div><div class="consultant-main"><strong>李晓雯</strong><span>高级健康管理师 · 慢病管理</span></div><span class="online">在线</span></div><button class="primary" id="consultBtn">立即咨询</button></section>
      <div class="section"><h2>健康提醒</h2></div><section class="notice"><b>♧</b><span>你的体检报告已有 3 项指标需要关注，建议查看健康结果。</span></section>
    </div>
    <nav class="nav"><button class="active"><b>⌂</b>首页</button><button id="navHealth"><b>◉</b>我的健康</button><button id="navReport"><b>▤</b>报告</button><button id="navService"><b>♧</b>服务</button><button id="navProfile"><b>♙</b>我的</button></nav>
    <div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><h3>上传体检报告</h3><p>支持 PDF / JPG / PNG，上传后将进行 Mock 解析。</p><div class="upload" id="mockUpload">↑<br/><strong>点击模拟上传并解析</strong></div></div></div>
    <div class="toast" id="toast">已进入 Mock 解析流程</div>
  </main>
  <script>
    const modal=document.querySelector('#modal'),toast=document.querySelector('#toast');
    const showToast=message=>{toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)};
    document.querySelector('#uploadBtn').onclick=()=>modal.classList.add('show');document.querySelector('#close').onclick=()=>modal.classList.remove('show');
    document.querySelector('#mockUpload').onclick=()=>{modal.classList.remove('show');showToast('Mock解析成功，正在打开健康结果');setTimeout(()=>location.href='result.html',450)};
    document.querySelector('#manualBtn').onclick=()=>location.href='manual.html';document.querySelector('#consultBtn').onclick=()=>location.href='all.html#C-12';
    document.querySelector('#healthLink').onclick=()=>location.href='health.html';document.querySelector('#navHealth').onclick=()=>location.href='health.html';document.querySelector('#navReport').onclick=()=>location.href='report.html';document.querySelector('#navService').onclick=()=>location.href='all.html#C-11';document.querySelector('#navProfile').onclick=()=>location.href='all.html#C-16';
  </script>
</body>
</html>
