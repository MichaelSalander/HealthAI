<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI健康管理｜全量 Prototype</title>
<style>
:root{--g:#10b8a4;--gd:#087e78;--ink:#15223a;--muted:#71828a;--bg:#f5fbfa;--navy:#102943;--line:#e4eeec;--red:#f04438}*{box-sizing:border-box}body{margin:0;background:#dfeae8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 25px;position:sticky;top:0;z-index:3}.brand{font-weight:800;color:var(--gd);font-size:18px}.top button,.side button{border:0;border-radius:9px;padding:9px 13px;background:#edf7f5;color:var(--muted);font-weight:700}.top button.active,.side button.active{background:var(--g);color:#fff}.layout{display:flex;max-width:1420px;margin:auto;min-height:calc(100vh - 60px)}.side{width:235px;background:#fff;padding:18px 12px;border-right:1px solid var(--line)}.side button{display:block;width:100%;text-align:left;background:transparent;margin:3px 0;font-size:12px}.main{flex:1;padding:28px}.mobile{width:390px;max-width:100%;min-height:760px;margin:auto;background:var(--bg);padding:25px 18px;border-radius:25px;box-shadow:0 18px 55px #16453d22}.mobile h1{font-size:21px;margin:18px 0 7px}.lead,.sub{color:var(--muted);font-size:12px;line-height:1.6}.card,.panel{background:#fff;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 10px 30px #1e706312}.title{font-weight:800;font-size:16px;margin:19px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:0;border-radius:14px;padding:15px 10px;text-align:left;background:#e8faf7;color:var(--gd);font-weight:700}.tile.primary{background:var(--g);color:#fff}.tile b{display:block;font-size:25px;margin-bottom:8px}.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.grow{flex:1}.pill{display:inline-block;border-radius:9px;background:#e8faf7;color:var(--gd);padding:5px 9px;font-size:11px}.danger{color:var(--red);font-weight:700;font-size:12px}.ring{width:110px;height:110px;margin:6px auto;border-radius:50%;border:11px solid #b9f1e7;border-right-color:var(--g);display:grid;place-items:center;text-align:center}.ring b{font-size:32px}.ring span{display:block;color:var(--muted);font-size:10px}.bar{flex:1;background:linear-gradient(#2bcab3,#c2f3ea);border-radius:9px 9px 0 0}.chart{height:125px;display:flex;align-items:end;gap:14px;border-bottom:1px solid var(--line);padding:10px}.labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:6px}.button{width:100%;border:0;border-radius:13px;background:var(--g);color:#fff;padding:13px;margin-top:14px;font-weight:800}.desktop{background:#f5f8fa;min-height:750px;border-radius:15px;display:flex;overflow:hidden}.dnav{width:190px;background:var(--navy);padding:18px 12px;color:#fff}.dnav b{display:block;font-size:14px;margin:0 8px 25px}.dnav button{display:block;width:100%;border:0;background:transparent;color:#d5e4ee;text-align:left;border-radius:8px;padding:11px 9px;margin:2px 0;font-size:12px}.dnav button.active{background:#1763aa;color:#fff}.dmain{flex:1;padding:25px}.dhead{display:flex;justify-content:space-between;align-items:center}.dhead h1{margin:0;font-size:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.stat{background:#fff;border-radius:12px;padding:15px}.stat span{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:25px;margin-top:9px}.table{background:#fff;border-radius:12px;margin-top:16px;overflow:hidden}.tr{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 70px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:12px}.tr.head{background:#f0f7f6;color:var(--muted);font-weight:700}.tag{color:#2875c2;font-weight:700}.back{border:0;background:#fff;border-radius:50%;width:30px;height:30px;font-size:20px}@media(max-width:700px){body{background:var(--bg)}.layout{display:block}.side{width:100%;display:flex;overflow:auto;padding:8px}.side button{white-space:nowrap;width:auto}.main{padding:12px}.desktop{min-height:700px}.dnav{display:none}.dmain{padding:15px}.stats{grid-template-columns:1fr 1fr}.tr{grid-template-columns:1.4fr 1fr 1fr 55px}.top{padding:0 10px;gap:7px;overflow:auto;white-space:nowrap}}
</style></head>
<body><header class="top"><span class="brand">AI智能健康管理</span><button data-role="C" class="active">客户端 C</button><button data-role="H">健管师 H</button><button data-role="A">公司后台 A</button></header><div class="layout"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const data={C:[['C-01','首页'],['C-02','我的健康'],['C-03','手动记录'],['C-04','体检报告'],['C-05','健康结果'],['C-06','找健管师'],['C-07','健管师详情'],['C-08','7天体验'],['C-09','正式方案'],['C-10','增值服务'],['C-11','我的服务'],['C-12','1V1咨询'],['C-13','服务记录'],['C-14','历史趋势'],['C-15','我的订单'],['C-16','个人中心']],H:[['H-01','工作台首页'],['H-02','我的客户'],['H-03','客户360'],['H-04','AI客户洞察'],['H-05','服务记录'],['H-06','收益中心']],A:[['A-01','健管师管理'],['A-02','九大分类管理'],['A-03','商品与价格管理'],['A-04','订单管理'],['A-05','分润与结算'],['A-06','数据统计与运营']]};let role='C',id='C-01';
const side=document.querySelector('#side'),main=document.querySelector('#main');const go=x=>{id=x;location.hash=x;render()};
function metric(){return `<div class="card">${['LDL-C（低密度脂蛋白）　4.2 mmol/L','ALT（丙氨酸转氨酶）　68 U/L','空腹血糖　6.8 mmol/L'].map(x=>`<div class="row"><span style="color:var(--red);font-size:22px">↗</span><div class="grow"><b>${x.split('　')[0]}</b><span class="sub">${x.split('　')[1]}（参考值）</span></div><span class="danger">偏高</span></div>`).join('')}</div>`}
function trends(){return `<div class="card"><div class="chart"><i class="bar" style="height:85%"></i><i class="bar" style="height:67%"></i><i class="bar" style="height:74%"></i><i class="bar" style="height:52%"></i></div><div class="labels"><span>9月</span><span>10月</span><span>11月</span><span>12月</span></div></div>`}
function mobile(){const name=data.C.find(x=>x[0]===id)[1];let body={
'C-01':`<div class="card grid"><button class="tile primary" onclick="go('C-04')"><b>▧</b>上传体检报告<span class="sub">AI辅助基础分析</span></button><button class="tile" onclick="go('C-03')"><b>＋</b>手动录入数据<span class="sub">记录每日变化</span></button></div><div class="title">我的健康</div><div class="card row"><div class="ring"><div><b>85</b><span>健康评分</span></div></div><div class="grow"><b>整体健康状况良好</b><span class="sub">已有 3 项指标需要关注</span></div></div><div class="title">我的主责健康管理师</div><div class="card row"><span style="font-size:35px">👩🏻‍⚕️</span><div class="grow"><b>李晓雯</b><span class="sub">高级健康管理师 · 慢病管理</span></div><span class="pill">在线</span></div>`,
'C-02':`<div class="card" style="text-align:center"><div class="ring"><div><b>85</b><span>健康评分</span></div></div><b>整体健康状况良好</b></div><div class="title">需要关注的 3 项指标</div>${metric()}<div class="title">健康趋势　<span class="pill">体重</span> <span class="pill">血压</span></div>${trends()}`,
'C-03':`<div class="card"><span class="sub">记录结果会进入你的长期健康档案</span><div class="title">体重（kg）</div><input value="62.5" style="width:100%;border:0;border-bottom:1px solid var(--line);font-size:26px;padding:12px 0"><div class="title">记录备注</div><textarea style="width:100%;height:120px;border:1px solid var(--line);border-radius:12px;padding:12px" placeholder="例如：今天运动30分钟…"></textarea><button class="button" onclick="go('C-02')">保存记录</button></div>`,
'C-04':`<div class="card" style="text-align:center;border:1px dashed #80d9cd;padding:50px 15px"><div style="font-size:50px;color:var(--gd)">⇧</div><b>上传体检报告</b><span class="sub">支持 PDF / JPG / PNG，最大 20MB</span><button class="button" onclick="alert('Mock解析成功')">选择文件并解析</button></div><div class="title">历史报告</div><div class="card">${['2024年度体检报告.pdf','2023年度体检报告.pdf','2022年度体检报告.pdf'].map(x=>`<div class="row"><span>▤</span><div class="grow"><b>${x}</b><span class="sub">解析成功</span></div><span class="pill">已完成</span></div>`).join('')}</div>`,
'C-05':`<div class="card" style="text-align:center;background:#e5fbf5"><div class="ring"><div><b>85</b><span>健康评分</span></div></div><b>整体健康状况良好</b><span class="sub">继续保持良好的生活方式</span></div><div class="title">需要关注的指标</div>${metric()}<div class="card"><b>想获得更完整的健康解读？</b><span class="sub">咨询主责健康管理师，获取专业服务建议</span><button class="button" onclick="go('C-12')">咨询我的健康管理师</button></div>`}[id];return `<div class="mobile"><button class="back" onclick="go('C-01')">‹</button><h1>${id}　${name}</h1><div class="lead">消费级健康管理服务与持续数据记录</div>${body||genericC(name)}</div>`}
function genericC(name){return `<div class="title">${name}</div><div class="card">${['基础信息','健康指标','服务内容','历史记录','快捷操作'].map(x=>`<div class="row"><b>${x}</b><span class="grow"></span><span>›</span></div>`).join('')}</div><button class="button">立即操作</button>`}
function consultant(){const nav=`<nav class="dnav"><b>◉ 健康管理平台</b>${data.H.map(x=>`<button class="${x[0]===id?'active':''}" onclick="go('${x[0]}')">▣　${x[1]}</button>`).join('')}</nav>`;const head=`<div class="dhead"><div><h1>${data.H.find(x=>x[0]===id)[1]}</h1><span class="sub">客户健康资料、报告与 AI 洞察</span></div><button class="button" style="width:auto;margin:0">导出</button></div>`;if(id==='H-02')return `<div class="desktop">${nav}<section class="dmain">${head}<div class="stats"><div class="stat"><span>我的客户</span><strong>12</strong></div><div class="stat"><span>待确认报告</span><strong>5</strong></div><div class="stat"><span>异常指标</span><strong>18</strong></div><div class="stat"><span>今日待跟进</span><strong>4</strong></div></div><div class="table"><div class="tr head"><span>客户</span><span>健康档案</span><span>报告/指标</span><span>更新时间</span><span>操作</span></div>${['王小明','张女士','陈先生','李雯','刘阿姨'].map((x,i)=>`<div class="tr"><b>${x}</b><span>${i===2?'资料待补充':'资料完整'}</span><span class="${i===2?'danger':''}">${i===2?'待确认 2 项':'异常 3 项'}</span><span>2024-12-${10+i}</span><button class="pill" onclick="go('H-03')">查看分析</button></div>`).join('')}</div></section></div>`;if(id==='H-03')return `<div class="desktop">${nav}<section class="dmain">${head}<div class="panel"><div class="title">王小明 · 客户健康档案</div><div class="row"><b>档案完整度</b><span class="grow"></span><span class="pill">86%</span></div><div class="row"><b>最近体检报告</b><span class="grow"></span><span>2024-10-10　已解析</span></div><div class="row"><b>数据来源</b><span class="grow"></span><span>报告 2 份 · 手动记录 8 条</span></div></div><div class="title">近期异常指标</div>${metric()}<button class="button" onclick="go('H-04')">查看 AI 客户洞察</button></section></div>`;if(id==='H-04')return `<div class="desktop">${nav}<section class="dmain">${head}<div class="panel"><div class="title">王小明 · AI 客户健康洞察</div><span class="pill">需关注</span><p class="sub">基于已确认的 5 项健康指标与 2 份体检报告生成。</p><div class="row"><b>整体摘要</b><span class="grow"></span><span>检测到 3 项指标需要持续跟进</span></div><div class="row"><b>重点关注</b><span class="grow"></span><span class="danger">LDL-C、ALT、空腹血糖</span></div><div class="row"><b>建议跟进</b><span class="grow"></span><span>饮食、运动与复查计划</span></div></div><div class="panel"><div class="title">健管师工作建议</div><p class="sub">建议在下一次咨询中确认用户近期饮食、运动和用药情况，并提醒按计划复查。此内容为 AI 辅助摘要，需由健管师审核后使用。</p><button class="button" onclick="go('H-05')">建立服务记录</button></div></section></div>`;return `<div class="desktop">${nav}<section class="dmain">${head}<div class="panel"><div class="title">${data.H.find(x=>x[0]===id)[1]}</div><p class="sub">这里将展示客户服务记录与持续跟进数据。</p></div></section></div>`}
function desktop(){const name=data[role].find(x=>x[0]===id)[1];const rows=role==='H'?['王小明','张女士','陈先生','李雯','刘阿姨']:['李晓雯','王雅婷','张志远','陈悦','刘阿姨'];return `<div class="desktop"><nav class="dnav"><b>◉ 健康管理平台</b>${data[role].map(x=>`<button class="${x[0]===id?'active':''}" onclick="go('${x[0]}')">▣　${x[1]}</button>`).join('')}</nav><section class="dmain"><div class="dhead"><div><h1>${name}</h1><span class="sub">${role==='H'?'客户管理、AI洞察与服务跟进':'健管师、商品、订单、分润与数据运营'}</span></div><button class="button" style="width:auto;margin:0">${role==='A'?'新增':'导出'}</button></div><div class="stats"><div class="stat"><span>本月客户</span><strong>${role==='H'?'12':'2,856'}</strong></div><div class="stat"><span>待处理</span><strong>${role==='H'?'5':'1,203'}</strong></div><div class="stat"><span>本月收入</span><strong>¥238,000</strong></div><div class="stat"><span>服务状态</span><strong>28</strong></div></div><div class="table"><div class="tr head"><span>名称/客户</span><span>类型</span><span>状态</span><span>更新时间</span><span>操作</span></div>${rows.map((x,i)=>`<div class="tr"><b>${x}</b><span>${i%2?'高级健康管理':'体重管理'}</span><span class="pill">${i%3?'服务中':'待跟进'}</span><span>12-${10+i}</span><span style="color:#2875c2">详情 ›</span></div>`).join('')}</div>${id==='A-06'||id==='H-06'?`<div class="panel"><div class="title">趋势与运营统计</div>${trends()}</div>`:''}</section></div>`}
function render(){side.innerHTML=data[role].map(x=>`<button class="${x[0]===id?'active':''}" onclick="go('${x[0]}')">${x[0]}　${x[1]}</button>`).join('');main.innerHTML=role==='C'?mobile():role==='H'?consultant():desktop();document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role))}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;id=data[role][0][0];render()});if(location.hash){const x=location.hash.slice(1);const found=Object.entries(data).find(([r,a])=>a.some(s=>s[0]===x));if(found){role=found[0];id=x}}render();
</script></body></html>
<script>
document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || button.textContent.trim() !== '立即操作') return;
  const next = { 'C-06': 'C-07', 'C-07': 'C-08', 'C-08': 'C-09', 'C-09': 'C-10', 'C-10': 'C-11', 'C-11': 'C-15', 'C-13': 'C-14', 'C-14': 'C-05', 'C-15': 'C-16' }[location.hash.slice(1)];
  if (next) go(next);
});
</script>
